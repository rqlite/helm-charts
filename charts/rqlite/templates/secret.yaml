{{- $name := tpl (include "rqlite.fullname" .) $ -}}
{{- include "rqlite.generateSecrets" . }}
{{- $config := .Values.config }}
{{/*
List of additional generated system users which will be concatenated with the
user-suppplied list below
*/}}
{{- $internalUsers := list
     (dict "username" "_system_probes" "perms" (list "ready")
      "password" (.Release.rqlite.probePassword))
     (dict "username" "_system_rqlite" "perms" (list "all")
      "password" (.Release.rqlite.rqlitePassword))
}}
{{/* Construct the "sub" key for backup.json and restore.json */}}
{{- $backupStorage := dict
      "access_key_id" (dig "backup" "storage" "accessKeyId" nil $config)
      "secret_access_key" (dig "backup" "storage" "secretAccessKey" nil $config)
      "endpoint" (dig "backup" "storage" "endpoint" nil $config)
      "region" (dig "backup" "storage" "region" nil $config)
      "bucket" (dig "backup" "storage" "bucket" nil $config)
      "path" (dig "backup" "storage" "path" nil $config)
      "force_path_style" (dig "backup" "storage" "forcePathStyle" false $config)
}}
{{- if and $backupStorage.endpoint (not (contains "://" $backupStorage.endpoint)) }}
  {{/*
  As part of the upgrade to AWS SDK v2 in rqlite v8.29.3, the endpoint now must be
  specified as a URI rather than a straight FQDN. This is a breaking change, but rather
  than bumping the major version of the chart to reflect the incompatibility, we just
  prepend "https://" to the endpoint if it doesn't already contain a scheme.
  */}}
  {{- $_ := set $backupStorage "endpoint" (printf "https://%s" $backupStorage.endpoint) }}
{{- end }}
{{- $backup := dict }}
{{- $restore := dict }}
{{- if dig "backup" "autoBackup" "enabled" false $config }}
  {{- $backup = dict
        "version" 1
        "type" (dig "backup" "storage" "type" "s3" $config)
        "interval" (dig "backup" "autoBackup" "interval" nil $config)
        "vacuum" (dig "backup" "autoBackup" "vacuum" false $config)
        "no_compress" (dig "backup" "autoBackup" "noCompress" false $config)
        "timestamp" (dig "backup" "autoBackup" "timestamp" false $config)
        "sub" $backupStorage
  }}
{{- end }}
{{- if dig "backup" "autoRestore" "enabled" false $config }}
  {{- $restore = dict
        "version" 1
        "type" (dig "backup" "storage" "type" "s3" $config)
        "timeout" (dig "backup" "autoRestore" "timeout" "60s" $config)
        "continue_on_failure" (dig "backup" "autoRestore" "continueOnFailure" false $config)
        "sub" $backupStorage
  }}
{{- end }}
{{/* Construct the CDC config dict */}}
{{- $cdc := dict }}
{{- if dig "cdc" "enabled" false $config }}
  {{- $cdcEndpoint := dig "cdc" "endpoint" "" $config }}
  {{- if empty $cdcEndpoint }}
    {{- fail "config.cdc.endpoint must be defined when config.cdc.enabled is true" }}
  {{- end }}
  {{- $cdc = dict "endpoint" $cdcEndpoint }}
  {{- with dig "cdc" "serviceId" nil $config }}
    {{- $_ := set $cdc "service_id" . }}
  {{- end }}
  {{- if dig "cdc" "rowIdsOnly" false $config }}
    {{- $_ := set $cdc "row_ids_only" true }}
  {{- end }}
  {{- with dig "cdc" "tableFilter" nil $config }}
    {{- $_ := set $cdc "table_filter" . }}
  {{- end }}
  {{/* CDC TLS settings */}}
  {{- $cdcTLS := dict }}
  {{- $cdcTLSSecretName := dig "cdc" "tls" "secretName" nil $config }}
  {{- if $cdcTLSSecretName }}
    {{- $_ := set $cdcTLS "ca_cert_file" "/config/cdc-tls/ca.crt" }}
    {{- $_ := set $cdcTLS "cert_file" "/config/cdc-tls/tls.crt" }}
    {{- $_ := set $cdcTLS "key_file" "/config/cdc-tls/tls.key" }}
  {{- else }}
    {{- if dig "cdc" "tls" "ca" "" $config }}
      {{- $_ := set $cdcTLS "ca_cert_file" "/config/sensitive/cdc-ca.crt" }}
    {{- end }}
    {{- if dig "cdc" "tls" "cert" "" $config }}
      {{- $_ := set $cdcTLS "cert_file" "/config/sensitive/cdc-client.crt" }}
    {{- end }}
    {{- if dig "cdc" "tls" "key" "" $config }}
      {{- $_ := set $cdcTLS "key_file" "/config/sensitive/cdc-client.key" }}
    {{- end }}
  {{- end }}
  {{- if dig "cdc" "tls" "insecureSkipVerify" false $config }}
    {{- $_ := set $cdcTLS "skip_verify" true }}
  {{- end }}
  {{- with dig "cdc" "tls" "serverName" nil $config }}
    {{- $_ := set $cdcTLS "server_name" . }}
  {{- end }}
  {{- if $cdcTLS }}
    {{- $_ := set $cdc "tls" $cdcTLS }}
  {{- end }}
  {{/* CDC optional settings */}}
  {{- with dig "cdc" "maxBatchSize" nil $config }}
    {{- $_ := set $cdc "max_batch_size" . }}
  {{- end }}
  {{- with dig "cdc" "maxBatchDelay" nil $config }}
    {{- $_ := set $cdc "max_batch_delay" . }}
  {{- end }}
  {{- with dig "cdc" "highWatermarkInterval" nil $config }}
    {{- $_ := set $cdc "high_watermark_interval" . }}
  {{- end }}
  {{- with dig "cdc" "transmitTimeout" nil $config }}
    {{- $_ := set $cdc "transmit_timeout" . }}
  {{- end }}
  {{- with dig "cdc" "transmitMaxRetries" nil $config }}
    {{- $_ := set $cdc "transmit_max_retries" . }}
  {{- end }}
  {{- with dig "cdc" "transmitRetryPolicy" nil $config }}
    {{- $_ := set $cdc "transmit_retry_policy" . }}
  {{- end }}
  {{- with dig "cdc" "transmitMinBackoff" nil $config }}
    {{- $_ := set $cdc "transmit_min_backoff" . }}
  {{- end }}
  {{- with dig "cdc" "transmitMaxBackoff" nil $config }}
    {{- $_ := set $cdc "transmit_max_backoff" . }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "rqlite.labels" . | nindent 4 }}
type: Opaque
stringData:
  users.json: |-
    {{- if $config.users }}
    {{- $users := concat $internalUsers $config.users }}
    {{- tpl ($users | toPrettyJson) . | nindent 4}}
    {{- end }}

  {{- with $backup }}
  backup.json: |-
    {{- tpl (. | toPrettyJson) $ | nindent 4}}
  {{- end }}

  {{- with $restore }}
  restore.json: |-
    {{- tpl (. | toPrettyJson) $ | nindent 4}}
  {{- end }}

  {{- with $cdc }}
  cdc.json: |-
    {{- tpl (. | toPrettyJson) $ | nindent 4}}
  {{- end }}

{{- include "rqlite.renderTLSFiles" (dict "value" "node" "ctx" $) | nindent 2 }}
{{- include "rqlite.renderTLSFiles" (dict "value" "client" "ctx" $) | nindent 2 }}
{{- if and (dig "cdc" "enabled" false $config) (not (dig "cdc" "tls" "secretName" nil $config)) }}
  {{- with dig "cdc" "tls" "ca" "" $config }}
  cdc-ca.crt: {{ . | quote }}
  {{- end }}
  {{- with dig "cdc" "tls" "cert" "" $config }}
  cdc-client.crt: {{ . | quote }}
  {{- end }}
  {{- with dig "cdc" "tls" "key" "" $config }}
  cdc-client.key: {{ . | quote }}
  {{- end }}
{{- end }}
---
# Persist the generated passwords in the K8s cluster to ensure consistency if the chart is
# upgraded.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-internal
  labels:
    {{- include "rqlite.labels" . | nindent 4 }}
type: Opaque
data:
  probePassword: {{ .Release.rqlite.probePassword | b64enc | quote }}
  rqlitePassword: {{ .Release.rqlite.rqlitePassword | b64enc | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-extra
  labels:
    {{- include "rqlite.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.extraFiles }}
    {{- tpl (toYaml .) $ | nindent 2 }}
  {{- end }}
